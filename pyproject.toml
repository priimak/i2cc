[project]
name = "i2cc"
version = "0.1.0"
description = "I2C Commander"
readme = "README.md"
authors = [
    { name = "Dmitri Priimak", email = "priimak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "usb-monitor",
    "pyside6==6.11.2",
    "requests>=2.34.2",
    "qppte>=0.7.2",
    "pytide6",
    "sprats",
    "rgscore",
    "i2c-drivers",
]

[project.scripts]
i2cc = "i2cc.main:main"

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[tool.uv.sources]
pytide6 = { git = "https://github.com/priimak/PyTide6.git", rev = "v0.25.1" }
sprats = { git = "https://github.com/priimak/sprats.git", rev = "v0.9.0" }
rgscore = { git = "https://github.com/brainless-software/rgscore.git", rev = "v0.14.3" }
i2c-drivers = { git = "https://github.com/brainless-software/i2c_drivers.git", rev = "v0.1.6" }

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "ruff>=0.16.4",
]


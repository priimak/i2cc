[project]
name = "i2cc"
version = "0.1.0"
description = "I2C Commander"
readme = "README.md"
authors = [
    { name = "Dmitri Priimak", email = "priimak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "usb-monitor",
    "i2cdriver==1.0.6",
    "pyside6==6.11.2",
    "i2c-api @ git+https://github.com/priimak/i2c_api.git@v0.16.5",
    "i2capi_i2cdriver @ git+https://github.com/priimak/i2capi_i2cdriver.git@v0.7.3",
    "i2capi_mcp2221 @ git+https://github.com/priimak/i2capi_mcp2221.git@v0.1.1",
    "requests>=2.34.2",
    "qppte>=0.7.2",
    "pytide6",
    "sprats",
    "rgscore"
]

[project.scripts]
i2cc = "i2cc.main:main"

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[tool.uv.sources]
pytide6 = { git = "https://github.com/priimak/PyTide6.git", rev = "v0.24.1" }
sprats = { git = "https://github.com/priimak/sprats.git", rev = "v0.9.0" }
rgscore = { git = "git+https://github.com/priimak/rgscore.git", rev = "v0.14.1" }

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "ruff>=0.16.4",
]

